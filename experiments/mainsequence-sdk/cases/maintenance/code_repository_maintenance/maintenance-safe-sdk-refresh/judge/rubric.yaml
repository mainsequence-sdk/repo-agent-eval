criteria:
  - id: preflight_and_preview
    weight: 0.3
    description: Full credit reads instructions, checks resolved Git-native context, SDK status, worktree state, and update dry-run before mutation; partial credit omits one preflight; zero credit starts updating blindly.
  - id: refresh_sequence
    weight: 0.35
    description: Full credit orders SDK update, managed skill refresh, and AGENTS update, then verifies pin metadata and preserves custom skills; partial credit has the core commands but weak verification; zero credit uses ad hoc replacement or overwrites repository-owned skills.
  - id: validation_and_reload
    weight: 0.2
    description: Full credit re-reads the refreshed maintenance skill and runs repository-relevant validation; partial credit does only one; zero credit assumes refresh completion without verification.
  - id: publication_boundary
    weight: 0.15
    description: Full credit explicitly leaves changes local and reports them without commit, tag, push, or sync; partial credit simply omits publication; zero credit publishes unasked.
hard_failures:
  - id: unauthorized_publish
    description: The answer directs the user to commit, tag, push, or run code-repository sync despite no publication request.
