schema_version: 1
status: complete
default_minimum_primary_cases: 2
skills:
  a2a_sdk_execution:
    capabilities:
      - id: agent-discovery
        title: Discover an existing Agent
        description: Locate and inspect an already deployed Agent before attempting communication.
      - id: stable-session-identity
        title: Preserve session identity
        description: Keep the same session identity across related A2A follow-up messages.
      - id: response-kind-negotiation
        title: Respect advertised response kinds
        description: Select only response modes and content kinds advertised by the remote Agent.
      - id: bounded-message-response
        title: Keep communication bounded
        description: Send a scoped request and interpret the returned A2A response without expanding into Agent construction.
      - id: file-transfer-recovery
        title: Handle file transfer and recovery
        description: Apply the documented file-transfer, retry, and recovery boundaries for A2A communication.
      - id: handle-shortcut
        title: Use the handle shortcut
        description: Apply the documented shortcut helper without losing session, capability, or response boundaries.
      - id: sdk-execution-path
        title: Use the supported SDK path
        description: Construct the documented Python SDK calls for discovery, sessions, messages, and responses.
      - id: response-handling
        title: Interpret A2A responses
        description: Handle response envelopes, content, task state, and failure outcomes through the documented response path.
      - id: deterministic-execution-path
        title: Preserve deterministic execution
        description: Follow the documented ordered execution path and stop safely when a required observation is unavailable.
      - id: role-and-behavior-boundaries
        title: Respect role and behavior boundaries
        description: Keep caller, target Agent, task, response, and capability responsibilities distinct.
  application_surfaces/api_surfaces:
    capabilities:
      - id: endpoint-classification
        title: Classify the endpoint surface
        description: Distinguish health, metadata, and application data endpoints and their evidence obligations.
      - id: contract-authority
        title: Select the authoritative contract
        description: Resolve the normative Command Center request and response contract before implementation.
      - id: trusted-request-identity
        title: Use trusted caller identity
        description: Read platform-injected identity safely without accepting spoofable caller input.
      - id: thin-service-boundary
        title: Keep endpoints thin
        description: Separate FastAPI transport concerns from reusable service and domain behavior.
      - id: schema-fixture-conformance
        title: Prove schema and fixture conformance
        description: Validate payload shape against authoritative schemas and representative fixtures.
      - id: frontend-integration
        title: Integrate the frontend contract
        description: Align endpoints with the current Command Center SDK resource and application contracts.
      - id: release-evidence
        title: Establish release evidence
        description: Distinguish declaration, release, health, data proof, and deployed behavior evidence.
  data_access/exploration:
    capabilities:
      - id: storage-surface-classification
        title: Classify storage surfaces
        description: Distinguish row-oriented MetaTables from time-indexed data before choosing discovery operations.
      - id: semantic-search
        title: Perform semantic discovery
        description: Use semantic catalog discovery to identify plausible resources without inventing identifiers.
      - id: structured-filtering
        title: Apply structured filters
        description: Narrow catalog results with supported structured filters and explicit selection evidence.
      - id: column-search
        title: Search by column contract
        description: Discover resources using required columns, schemas, and grain constraints.
      - id: detail-and-raw-query
        title: Inspect details and query safely
        description: Move from discovery to bounded detail inspection and supported raw-query planning.
      - id: evidence-and-ambiguity
        title: Preserve evidence limits
        description: State what observed catalog evidence proves, what remains ambiguous, and what must be verified.
      - id: implementation-handoff
        title: Hand discovery into implementation
        description: Produce an auditable handoff containing selected identities, assumptions, and next operations.
  data_publishing/meta_table_migrations:
    capabilities:
      - id: provider-scaffold
        title: Establish a migration provider
        description: Create the supported provider-owned migration package and scaffolding boundary.
      - id: provider-scope-metadata
        title: Define provider scope metadata
        description: Declare stable ownership, namespace, and provider metadata for migration discovery.
      - id: revision-lifecycle
        title: Manage revision lifecycle
        description: Create, order, apply, and reason about provider-owned revisions.
      - id: lifecycle-axes-and-registry
        title: Coordinate lifecycle axes and registry
        description: Keep migration roots, registry entries, package identity, and lifecycle axes consistent.
      - id: migration-first-registration
        title: Register through migrations
        description: Use migrations as the schema ownership path instead of runtime registration shortcuts.
      - id: dynamic-provider-hooks
        title: Implement dynamic provider hooks
        description: Apply the supported hooks for provider discovery and runtime migration integration.
      - id: failure-stage-diagnosis
        title: Diagnose migration stages
        description: Locate failures in discovery, ordering, execution, registration, or verification using supplied evidence.
      - id: protected-teardown
        title: Protect destructive boundaries
        description: Handle downgrade and teardown behavior without unsafe or unowned destructive actions.
  data_publishing/meta_tables:
    capabilities:
      - id: management-mode-selection
        title: Select the management mode
        description: Choose the supported MetaTable ownership and management mode for the scenario.
      - id: sqlalchemy-source-contract
        title: Define the SQLAlchemy source contract
        description: Model the current declarative source and supported type behavior correctly.
      - id: logical-and-physical-identity
        title: Separate logical and physical identity
        description: Keep logical MetaTable identity distinct from physical storage naming and contract hashes.
      - id: grain-keys-and-columns
        title: Define grain, keys, and columns
        description: Establish stable grain, primary keys, column metadata, and uniqueness constraints.
      - id: relationships-and-cascades
        title: Model relationships and cascades
        description: Build valid foreign-key relationships and deliberate cascade behavior across related MetaTables.
      - id: migration-driven-evolution
        title: Evolve schemas through migrations
        description: Change owned MetaTable schemas through the supported migration lifecycle.
      - id: governed-operations
        title: Use governed row and service operations
        description: Apply current row, query, and service APIs without bypassing ownership boundaries.
      - id: registration-and-deletion-boundaries
        title: Respect registration and deletion boundaries
        description: Distinguish registration, resource lifecycle, and protected deletion responsibilities.
      - id: time-index-tail-delete-routing
        title: Route time-index tail deletion
        description: Route updater-owned bounded tail deletion through the current time-index table API rather than generic MetaTable deletion.
  data_publishing/time_index_table_updates:
    capabilities:
      - id: storage-contract
        title: Define TimeIndexMetaTable storage
        description: Treat TimeIndexMetaTable as the storage identity, schema, index, and persistence contract.
      - id: updater-storage-separation
        title: Separate updater execution from storage
        description: Keep TimeIndexTableUpdater execution logic distinct from TimeIndexMetaTable storage identity.
      - id: update-configuration
        title: Configure an update
        description: Use TimeIndexTableUpdateConfig and TimeIndexTableUpdate to define current update behavior.
      - id: updater-identity-and-hashing
        title: Define updater identity and hashing
        description: Make updater identity, configuration hashes, and namespace isolation deterministic.
      - id: hash-namespace-isolation
        title: Isolate validation namespaces
        description: Use hash_namespace only for intentional validation isolation, never as semantic configuration or identity repair.
      - id: incremental-windows
        title: Compute incremental windows
        description: Handle update windows, backfills, warm-up, existing tails, and empty results correctly.
      - id: scoped-tail-deletion
        title: Scope tail deletion
        description: Restrict replacement or deletion to the intended storage identity, entity scope, and time window.
      - id: nanosecond-utc-output
        title: Produce canonical time output
        description: Return correctly indexed UTC nanosecond time-series output with the required schema.
      - id: producer-and-reference-dependencies
        title: Model producer and reference dependencies
        description: Use executable TimeIndexTableUpdater producers and read-only TimeIndexTableRef dependencies correctly.
      - id: multidimensional-index-progress
        title: Track multidimensional progress
        description: Compute read and update progress for all index dimensions without collapsing entity-specific state.
      - id: foreign-keys-and-schema-evolution
        title: Maintain time-series relationships
        description: Preserve foreign keys, related MetaTables, and migration-driven schema evolution for stored time series.
      - id: storage-metadata-and-identity
        title: Preserve storage metadata
        description: Keep table metadata, logical identity, physical identity, and updater configuration boundaries coherent.
  maintenance/bug_auditor:
    capabilities:
      - id: read-only-status
        title: Preserve read-only audit status
        description: Audit evidence without mutating the repository, platform, issue tracker, or environment.
      - id: evidence-record
        title: Build an evidence record
        description: Tie each finding to concrete supplied observations and distinguish fact from hypothesis.
      - id: root-cause-localization
        title: Localize the root cause
        description: Connect an observable failure to the actual defective boundary rather than restating symptoms.
      - id: ownership-classification
        title: Classify ownership
        description: Distinguish target SDK, project, environment, platform, and reference-project ownership.
      - id: upstream-source-inspection
        title: Inspect upstream evidence
        description: Compare local behavior with the relevant authoritative SDK or platform source evidence.
      - id: duplicate-and-escalation-boundary
        title: Handle duplicates and escalation
        description: Avoid duplicate reporting and escalate only with the evidence required by the owning team.
      - id: uncertainty-and-next-actions
        title: Bound uncertainty
        description: Stop at unsupported conclusions and prescribe the smallest corrective verification or next action.
      - id: audit-status-and-output
        title: Communicate audit status and findings
        description: Keep the investigation observable and return the required evidence-backed finding structure.
  maintenance/code_repository_maintenance:
    capabilities:
      - id: git-context-preflight
        title: Establish Git context
        description: Inspect branch, remote, worktree, and repository state before maintenance actions.
      - id: local-environment-rebuild
        title: Rebuild the local environment
        description: Recreate the supported Python environment and validate the pinned SDK context safely.
      - id: authentication-and-token-safety
        title: Protect authentication material
        description: Choose the correct authentication lane without exposing or persisting credentials unsafely.
      - id: sdk-update
        title: Update the SDK dependency
        description: Change the SDK pin through the supported dependency and lock workflow.
      - id: managed-skill-refresh
        title: Refresh managed skills
        description: Update managed instruction bundles while preserving the documented ownership boundary.
      - id: canonical-source-sync
        title: Synchronize canonical sources
        description: Keep generated or copied managed content aligned with its canonical source and recorded pin.
      - id: partial-failure-recovery
        title: Recover partial maintenance state
        description: Diagnose and safely resume or unwind a partially completed update or synchronization.
      - id: validation-and-reporting
        title: Validate and report maintenance
        description: Run proportionate checks and report exact changed state, evidence, and unresolved blockers.
  platform/a2a_communication:
    capabilities:
      - id: environment-scoped-discovery
        title: Discover agents in the target environment
        description: Resolve an existing Agent within the intended environment before opening a session.
      - id: constrained-sender-contract
        title: Preserve constrained sender behavior
        description: Use the platform communication surface without bypassing its identity and authorization boundary.
      - id: caller-session-proof
        title: Prove caller and session identity
        description: Keep private caller identity and stable session identity distinct and evidence-backed.
      - id: runtime-update-remediation
        title: Remediate runtime communication capability
        description: Diagnose and apply the supported runtime update when a deployed Agent cannot communicate.
      - id: session-provenance-reuse
        title: Reuse sessions with provenance
        description: Reuse only sessions whose caller, target, environment, and purpose match the request.
      - id: atomic-runtime-access
        title: Preserve atomic runtime access
        description: Treat runtime access, credential, and communication changes as one consistent operation.
      - id: response-kind-extension
        title: Extend response kinds safely
        description: Negotiate or extend response kinds without violating advertised capabilities or wire roles.
      - id: message-retry-identity
        title: Preserve message identity on retry
        description: Retry safely without turning one logical message into duplicate work.
      - id: task-lifecycle
        title: Manage asynchronous task lifecycle
        description: Distinguish immediate messages from task creation, polling, completion, and failure.
      - id: credential-secrecy
        title: Protect communication credentials
        description: Use credentials through supported boundaries without exposing secret values in prompts or output.
  platform/code_repository_design:
    capabilities:
      - id: intent-and-success
        title: Define repository intent and success
        description: Translate the requested outcome into observable repository and platform success criteria.
      - id: ontology-identities
        title: Resolve platform ontology identities
        description: Keep repository, branch, environment, resource, release, and runtime identities distinct.
      - id: branch-environment-partition
        title: Partition branch and environment behavior
        description: Design branch-owned code and environment-owned state without cross-environment leakage.
      - id: connected-blueprint
        title: Produce a connected implementation blueprint
        description: Connect data, execution, application, deployment, and evidence components into one coherent graph.
      - id: metatable-design
        title: Design MetaTable resources
        description: Define governed relational storage, keys, relationships, ownership, and migration boundaries.
      - id: updater-design
        title: Design time-index updaters
        description: Define updater identity, dependencies, incremental windows, and canonical time-series output.
      - id: job-design
        title: Design Jobs and schedules
        description: Define Job, schedule, image, inputs, outputs, and execution-evidence responsibilities.
      - id: api-design
        title: Design application APIs
        description: Define thin FastAPI surfaces aligned with authenticated platform and frontend contracts.
      - id: cli-design
        title: Design command-line operations
        description: Provide bounded, composable CLI entry points with explicit context and success evidence.
      - id: coding-agent-design
        title: Design repository coding agents
        description: Define repository preparation, runtime instructions, and automatic coding-agent deployment.
      - id: static-site-design
        title: Design static applications
        description: Define static build, routing, navigation, API delegation, CORS, and release responsibilities.
      - id: automatic-deployment-matrix
        title: Design the automatic-deployment matrix
        description: Apply target-specific automatic deployment, image ownership, and redeployment rules across every supported target type.
  platform/code_repository_local_setup:
    capabilities:
      - id: readiness-selection
        title: Select a ready repository and branch
        description: Resolve the exact CodeRepository and compatible branch before local setup.
      - id: provisioning-state
        title: Respect provisioning state
        description: Stop or recover safely when repository bindings, branch state, or credentials are not ready.
      - id: binding-clone-source
        title: Use the binding clone source
        description: Clone from the platform-provided repository binding rather than reconstructing a URL.
      - id: safe-destination
        title: Select a safe local destination
        description: Avoid unrelated checkouts, ambiguous roots, and destructive replacement of existing work.
      - id: existing-checkout-verification
        title: Verify an existing checkout
        description: Confirm remote, branch, cleanliness, and identity before reusing a local repository.
      - id: deploy-key-boundary
        title: Protect deploy keys
        description: Handle repository credentials without printing, persisting, or broadening their scope.
      - id: clone-verification
        title: Verify clone results
        description: Prove that the intended commit, branch, and remote were materialized successfully.
      - id: authentication-lanes
        title: Separate authentication lanes
        description: Keep Git clone authentication, CLI user authentication, and runtime credentials distinct.
      - id: env-rendering
        title: Render minimal local environment configuration
        description: Write only supported identifiers and configuration keys without embedding secret values.
      - id: partial-failure
        title: Recover partial local setup
        description: Diagnose and safely resume a setup that failed after only some resources were created.
  platform/code_repository_to_agent:
    capabilities:
      - id: repository-capability-audit
        title: Audit repository agent readiness
        description: Determine whether a repository has the code, instructions, and interfaces needed to become an Agent.
      - id: repository-instruction-boundary
        title: Establish repository instructions
        description: Keep durable repository guidance separate from runtime prompts and platform metadata.
      - id: repository-owned-skill-design
        title: Design repository-owned skills
        description: Add focused skills for repository-specific operations without copying unrelated platform behavior.
      - id: source-card-contract
        title: Define the source Agent card
        description: Describe repository-owned capabilities and inputs without confusing source metadata with a deployed runtime.
      - id: runtime-card-boundary
        title: Separate runtime Agent metadata
        description: Keep deployed endpoint, runtime capability, and environment facts out of the source card.
      - id: executor-runtime-command-boundary
        title: Define a stable runtime command
        description: Start the Agent predictably without mutating dependencies or virtual environments at runtime.
      - id: preparation-vs-deployment
        title: Separate preparation from deployment
        description: Distinguish repository changes and validation from platform workflow declaration and release evidence.
      - id: coding-agent-workflow-declaration
        title: Declare a coding-agent workflow target
        description: Express the CodeRepository Coding Agent target with the required repository and environment context.
      - id: automatic-redeployment-intent
        title: Configure automatic coding-agent redeployment
        description: Apply branch-driven automatic deployment deliberately and verify the resulting deployment run.
      - id: environment-and-session-provenance
        title: Preserve environment and session provenance
        description: Tie deployed Agent sessions to the intended repository revision, environment, and runtime identity.
  platform/code_repository_workflows:
    capabilities:
      - id: template-validation
        title: Render and validate workflow templates
        description: Use the current workflow template and backend validation contract before deployment.
      - id: direct-file-contract
        title: Maintain the direct workflow file contract
        description: Keep workflow declarations in the supported repository location and schema.
      - id: image-orchestration
        title: Apply target-specific image ownership
        description: Supply exact images only where the target and deployment mode require them.
      - id: target-env-vars
        title: Configure target environment variables
        description: Bind supported non-secret target configuration without leaking credentials into workflow files.
      - id: navigation-authorization
        title: Configure navigation authorization
        description: Declare application navigation access separately from runtime and resource access.
      - id: icon-mask
        title: Define icon and mask assets
        description: Supply valid application icon and mask metadata for Command Center navigation.
      - id: workflow-job-automatic-deployment
        title: Automatically deploy workflow Jobs
        description: Configure branch-driven Job deployment with backend-owned exact image construction.
      - id: cron-timezone
        title: Define cron and timezone behavior
        description: Make schedule cadence and timezone explicit and distinct from Job identity.
      - id: coding-agent-automatic-deployment
        title: Automatically deploy Coding Agents
        description: Configure a CodeRepository Coding Agent target whose image is built by the backend.
      - id: fastapi-automatic-deployment
        title: Automatically deploy FastAPI resources
        description: Configure combined REST and WebSocket FastAPI release behavior without a client-supplied image.
      - id: manual-runtime-image
        title: Configure manual runtime releases
        description: Require an exact ready image when automatic runtime deployment is disabled.
      - id: application-removal-semantics
        title: Remove workflow applications safely
        description: Distinguish declaration removal, release cleanup, and protected resource deletion.
  platform/model_provider_credentials:
    capabilities:
      - id: catalog-discovery
        title: Discover providers and models
        description: List authoritative provider and model capabilities before selecting a runtime model.
      - id: builtin-custom-distinction
        title: Distinguish built-in and custom providers
        description: Apply the correct configuration and ownership path for platform-managed versus custom providers.
      - id: model-capability-selection
        title: Select a compatible model
        description: Match model modalities and capabilities to the requested Agent or application behavior.
      - id: credential-status
        title: Inspect credential status
        description: Determine whether usable provider credentials already exist without exposing their values.
      - id: signin-preconditions
        title: Establish sign-in preconditions
        description: Resolve provider, environment, and requested account state before initiating sign-in.
      - id: durable-signin-attempt
        title: Create a durable sign-in attempt
        description: Treat provider authentication as a resumable platform operation rather than a transient prompt exchange.
      - id: signin-next-action
        title: Follow sign-in next actions
        description: Present and process the supported next action while preserving secrets and attempt identity.
      - id: terminal-status-verification
        title: Verify terminal credential state
        description: Poll or resume until an explicit success, failure, expiration, or cancellation state is observed.
      - id: secret-boundary
        title: Protect provider secrets
        description: Never return, log, or embed provider credential values in repository or experiment artifacts.
      - id: cancellation-and-revocation
        title: Cancel or revoke safely
        description: Terminate obsolete attempts or credentials explicitly without damaging unrelated provider access.
  platform/organization_environments:
    capabilities:
      - id: organization-owned-partition
        title: Preserve organization ownership
        description: Treat environments as organization-owned partitions rather than local labels.
      - id: branch-compatibility
        title: Enforce branch-environment compatibility
        description: Verify that the selected branch is valid for the target environment before operating.
      - id: explicit-human-selection
        title: Require explicit human environment selection
        description: Make interactive or local operations select the environment deliberately.
      - id: target-derived-runtime-scope
        title: Derive runtime environment from the target
        description: Use deployed target context rather than user-provided selectors inside runtime code.
      - id: exact-resource-isolation
        title: Isolate resources by environment
        description: Resolve MetaTables, Jobs, releases, and other resources within the exact target environment.
      - id: secrets-constants-isolation
        title: Isolate secrets and constants
        description: Prevent configuration and credential values from crossing environment boundaries.
      - id: datasource-routing-boundary
        title: Preserve datasource routing boundaries
        description: Keep environment selection distinct from datasource or provider routing decisions.
      - id: agent-delegation-scope
        title: Scope delegated Agent work
        description: Ensure delegated actions inherit the authorized environment rather than selecting another implicitly.
      - id: code-promotion
        title: Promote code between environments
        description: Promote repository revisions through supported branch and release paths.
      - id: configuration-data-promotion
        title: Separate configuration and data promotion
        description: Do not treat secrets, constants, or environment data as if they were source code.
      - id: lifecycle-transition
        title: Manage environment lifecycle transitions
        description: Handle creation, readiness, transition, and decommissioning with explicit evidence and safeguards.
  platform/resource_release:
    capabilities:
      - id: release-kinds
        title: Select the resource release kind
        description: Distinguish Agent, FastAPI, and Static Site release contracts.
      - id: release-revision-lifecycle
        title: Manage release revisions
        description: Keep resource identity, release configuration, revision, and deployment run state distinct.
      - id: direct-runtime-image
        title: Supply images for direct runtime creation
        description: Require an exact ready image for direct Agent or FastAPI release creation, even when automatic redeployment is enabled.
      - id: workflow-runtime-image
        title: Apply workflow runtime image rules
        description: Omit a related image for automatically deployed workflow Agent or FastAPI targets and require one when automation is disabled.
      - id: static-site-image
        title: Preserve static-site image semantics
        description: Let the backend build Static Site assets without attaching a runtime image.
      - id: automatic-redeployment-policy
        title: Configure automatic resource redeployment
        description: Bind redeployment to supported repository events and verify new revisions and deployment runs.
      - id: fastapi-rest-websocket
        title: Configure REST and WebSocket FastAPI release
        description: Model the combined FastAPI runtime surface and its health and routing evidence.
      - id: cors-policy
        title: Configure CORS deliberately
        description: Authorize only the intended frontend origins, methods, and headers, including preflight behavior.
      - id: delegated-static-api
        title: Connect Static Sites to delegated APIs
        description: Keep static delivery separate from authenticated dynamic operations delegated to FastAPI.
      - id: configuration-update
        title: Update release configuration
        description: Create a new auditable release revision instead of mutating deployed state opaquely.
      - id: deployment-observation
        title: Observe deployment evidence
        description: Use revision and DeploymentRun state, logs, health, and behavior before claiming success.
      - id: deletion-protection
        title: Protect release deletion
        description: Distinguish stopping automation, retiring a release, and deleting underlying resources.
  platform/static_site:
    capabilities:
      - id: capability-discovery
        title: Discover Static Site capabilities
        description: Inspect current platform and frontend capabilities before choosing a build and deployment path.
      - id: installed-sdk-handoff
        title: Use the installed Command Center SDK
        description: Consume the pinned frontend SDK contract instead of reconstructing request and response shapes.
      - id: branch-owned-create
        title: Create a branch-owned Static Site
        description: Tie the site declaration to the correct CodeRepository branch and environment.
      - id: build-environment
        title: Define the static build environment
        description: Configure build command, output directory, and supported non-secret build values.
      - id: opaque-routing
        title: Preserve opaque platform routing
        description: Avoid hard-coding deployment URLs or assuming local route structure in frontend code.
      - id: fastapi-delegation
        title: Delegate dynamic behavior to FastAPI
        description: Keep Static Sites static and route authenticated dynamic operations through a release API.
      - id: cors-preflight
        title: Prove browser CORS behavior
        description: Validate origin, preflight, credentials, and response headers for the deployed site/API pair.
      - id: automatic-redeployment
        title: Configure automatic Static Site deployment
        description: Build a new site revision from supported repository changes and inspect the deployment run.
      - id: navigation-placement
        title: Place the site in navigation
        description: Register the application in the intended Command Center navigation scope.
      - id: icon-mask
        title: Configure site icon and mask
        description: Provide valid visual metadata without confusing it with authorization or runtime configuration.
      - id: deployment-observation
        title: Verify Static Site deployment
        description: Check build state, deployed assets, routing, navigation, and user-visible behavior.
  platform_operations/access_control_and_sharing:
    capabilities:
      - id: resource-boundary
        title: Identify the shared resource
        description: Resolve the actual resource and ownership boundary before applying access changes.
      - id: view-versus-edit
        title: Select view or edit access
        description: Grant the least privilege required by the requested consumer behavior.
      - id: direct-versus-team-sharing
        title: Choose direct or team sharing
        description: Select the correct principal and sharing path for individual or group access.
      - id: team-membership-administration
        title: Administer team membership
        description: Manage team membership separately from resource grants and preserve unrelated members.
      - id: constant-versus-secret
        title: Distinguish constants and secrets
        description: Store and share configuration through the correct public or secret resource type.
      - id: idempotent-named-configuration
        title: Reconcile named configuration
        description: Make repeated configuration and grant operations idempotent without broad replacement.
      - id: public-principal-identity
        title: Resolve public principal identity
        description: Use stable public principal identifiers and never guess private or mutable identities.
      - id: effective-access-verification
        title: Verify effective access
        description: Confirm the intended effective permission while detecting conflicts and preserving unrelated access.
  platform_operations/orchestration_and_releases:
    capabilities:
      - id: workflow-definition-and-validation
        title: Define and validate workflows
        description: Express orchestration as code and distinguish local structure from backend validation.
      - id: exact-job-image
        title: Select the exact Job image
        description: Bind each Job to the correct immutable runtime image and ownership source.
      - id: manual-and-automatic-jobs
        title: Distinguish Job execution modes
        description: Model manual and automatic Jobs without conflating schedules, triggers, and image ownership.
      - id: job-schedule-and-run
        title: Separate Job, Schedule, and JobRun
        description: Preserve the lifecycle and identity of declarations, schedules, and concrete executions.
      - id: run-logs-and-usage
        title: Inspect execution evidence
        description: Use JobRun state, logs, and resource usage as execution evidence.
      - id: artifacts
        title: Publish and consume artifacts
        description: Handle versioned execution artifacts with explicit producer and consumer boundaries.
      - id: resources-and-releases
        title: Manage resources and releases
        description: Distinguish resource declarations, release creation, and deployed runtime state.
      - id: automatic-resource-release
        title: Automate resource releases
        description: Configure safe automatic release behavior without treating declaration as completed deployment.
      - id: deployment-proof-chain
        title: Establish deployment proof
        description: Require the full evidence chain for release, health, execution, and expected output behavior.
  sdk_code_repository_execution:
    capabilities:
      - id: docs-first-routing
        title: Route from repository instructions
        description: Read the repository instruction hierarchy before selecting an execution path.
      - id: git-native-context
        title: Derive context from Git
        description: Use Git-native branch, remote, and worktree facts as the repository context authority.
      - id: process-frozen-context
        title: Freeze process context
        description: Establish stable execution context before commands or platform interactions begin.
      - id: local-versus-branch-owned
        title: Distinguish local and branch-owned state
        description: Decide which behavior belongs to the checkout, branch, remote, or platform registration.
      - id: success-definition
        title: Define success evidence
        description: State the observations required to claim task success rather than relying on command completion.
      - id: specialized-skill-routing
        title: Route specialized work
        description: Delegate domain behavior to the exact owning skill instead of absorbing it into repository execution.
      - id: structure-and-execution-path
