schema_version: 16

workspace:
  id: mainsequence-sdk-evaluation
  # Optional. When omitted, runtime data lives in ~/ms_agent_eval/<workspace-id>.

recording:
  enabled: true
  recorder: local-mlflow
  queue: local-recorder-queue
  failure_policy: continue
  wait_on_run_exit: false
  artifact_policy: full
  content_policy: full
  projection:
    live:
      enabled: true
      minimum_interval_seconds: 15
    stage_boundary:
      tables: incremental
      summaries: true
    finalization:
      reports: true
      plotly: true
      evidence: true
    traces:
      optimization:
        policy: winners_failures_and_sample
        sample_rate: 0.05
      validation: {policy: full}
      test: {policy: full}

recorders:
  local-mlflow:
    type: mlflow
    tracking_uri: http://192.168.1.17:5000
    experiment_name: ms-agent-eval/{workspace_id}/{experiment_id}
    authentication:
      type: none

recorder_queues:
  local-recorder-queue:
    type: filesystem
    path: operations/recorder-queue
    live_coalescing: true
    lease_seconds: 300
    max_attempts: 12

executors:
  lan-inference:
    type: endpoint
    adapter: openai_compatible
    endpoints:
      - id: llama-cpp-17-18081
        base_url: http://192.168.1.17:18081/v1
        max_concurrent_requests: 2
        routes:
          - deployment: qwen-27b-local
            model: qwen3.6:27b-coding
      - id: llama-cpp-17-18080
        base_url: http://192.168.1.17:18080/v1
        max_concurrent_requests: 2
        routes:
          - deployment: qwen-27b-local
            model: qwen3.6:27b-coding
      - id: llama-server-10-11434
        base_url: http://192.168.1.10:11434/v1
        max_concurrent_requests: 4
        routes:
          - deployment: qwen-27b-local
            model: qwen3.6:27b-coding
  artifact-harness:
    type: harness
    adapter: artifact_exchange
  local-process:
    type: process
    adapter: local

deployments:
  codex-author:
    executor: artifact-harness
    model: gpt-5.6-sol
    revision: gpt-5.6-sol-2026-09-13
  qwen-27b-local:
    executor: lan-inference
    model: qwen3.6:27b-coding
    revision: qwen3.6-27b-coding-local-2026-09-13

models:
  author:
    deployment: codex-author
    parameters:
      temperature: 0.0
  solver:
    deployment: qwen-27b-local
    reasoning_effort: none
    parameters:
      temperature: 0.2
      max_tokens: 4096
      timeout: 600
  judge:
    deployment: qwen-27b-local
    reasoning_effort: none
    parameters:
      temperature: 0.0
      max_tokens: 2048
      timeout: 300
  optimizer:
    deployment: qwen-27b-local
    reasoning_effort: none
    parameters:
      temperature: 0.7
      max_tokens: 4096
      timeout: 600

stages:
  author:
    executor: artifact-harness
    model: author
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 64000, wall_seconds: 1800}
  validate_judge:
    reuse: {policy: exact}
    budget: {model_calls: 100, tokens: 250000, wall_seconds: 1800}
  optimize:
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 32000, wall_seconds: 600}
  solve:
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 32000, wall_seconds: 600}
  judge:
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 64000, wall_seconds: 600}
  fit:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 1800}
  select:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 300}
  aggregate:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 300}

evaluation:
  repository:
    url: https://github.com/mainsequence-sdk/mainsequence-sdk
    ref: v8.1.12
  instructions:
    global:
      - agent_scaffold/AGENTS.md
    skills:
      directory: agent_scaffold/skills
    imports:
      - id: platform
        source: mcp
        note: >-
          Platform-owned skills imported from the authenticated Main Sequence MCP
          catalog and pinned by its manifest, ontology, resource paths, and content
          hashes. The imported files are experiment inputs; runs never refresh them.
        manifest: instructions/mainsequence-platform/manifest.yaml
        skills:
          directory: instructions/mainsequence-platform/skills
  case_authoring:
    instructions: case-authoring.md
    sources:
      - id: tutorial
        role: illustrative
        repository:
          url: https://github.com/mainsequence-projects/mainsequence-sdk-tutorial
          ref: v0.1.67
        include:
          - README.md
          - AGENTS.md
          - docs/**
          - src/**
          - tests/**
          - examples/**
      - id: mainsequence-markets
        role: project
        repository:
          url: https://github.com/mainsequence-projects/MainSequenceMarkets
          ref: v1.0.14
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - docs/**
          - src/**
          - apps/**
          - api/**
          - examples/**
          - tests/**
      - id: alpaca-connectors
        role: project
        repository:
          url: https://github.com/mainsequence-projects/alpaca-connectors
          ref: v0.1.32
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - tests/**
      - id: binance-connectors
        role: project
        repository:
          url: https://github.com/mainsequence-projects/binance-connectors
          ref: v0.1.25
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - agents/**
          - dashboards/**
          - examples/**
          - tests/**
      - id: marketsanalytics
        role: project
        repository:
          url: https://github.com/mainsequence-projects/marketsanalytics
          ref: v0.1.10
        include:
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - agent_release/**
          - tests/**
      - id: command-center-sdk
        role: contract_reference
        repository:
          url: https://github.com/mainsequence-sdk/command-center-sdk
          ref: v0.1.21
        include:
          - command-center-sdk/AGENTS.md
          - command-center-sdk/README.md
          - command-center-sdk/contracts/**
          - command-center-sdk/docs/backend-contracts.md
          - command-center-sdk/docs/resources.md
          - command-center-sdk/src/contracts/**
          - command-center-sdk/src/resource/**
          - command-center-sdk/agent_scaffold/skills/contracts/**
          - command-center-sdk/agent_scaffold/skills/resource/**
  cases:
    directory: cases
    coverage:
      catalog: cases/coverage.yaml
      minimum_cases_per_skill: 20
      minimum_leakage_groups_per_skill: 10
  splits:
    file: cases/splits.yaml
    policy:
      seed: mainsequence-sdk-foundations-v1
      train: 0.7
      test: 0.2
      challenge: 0.1
  judge:
    dspy:
      module: Predict
      signature:
        inputs:
          task: str
          skill_context: str
          rubric: str
          expected_response: str
          expected_artifacts: str
          candidate_response: str
        outputs:
          criterion_scores: dict[str, float]
          hard_failures: list[str]
          feedback: str
    validation:
      directory: judge-validation
    repetitions: 1

experiments:
  baseline:
    mode: evaluate
    roles:
      solver: solver
      judge: judge
    solver:
      dspy:
        module: Predict
        signature:
          inputs:
            global_context: str
            skill_context: str
            task: str
          outputs:
            response: str
    runtime:
      type: response_only
      python: "3.12"
    repetitions: 1
  optimize-solver:
    mode: optimize
    based_on: baseline
    roles:
      solver: solver
      optimizer: optimizer
      judge: judge
    optimizer:
      strategy: copro
      targets:
        prompt: true
        skills: all
      search:
        breadth: 3
        depth: 2
        partitions: 2
        init_temperature: 1.4
      metric:
        name: rubric_mean_score
    validation:
      strategy: holdout
      fraction: 0.2
      seed: 0
    budget:
      optimizer:
        model_calls: 500
        tokens: 2000000
      solver:
        model_calls: 30000
        tokens: 120000000
      judge:
        model_calls: 100000
        tokens: 200000000
      wall_seconds: 14400

comparisons:
  solver-and-copro-models:
    baseline_experiments:
      - baseline
    optimization_experiments:
      - optimize-solver
    primary_metric: score.mean
    grouping:
      - solver
      - optimizer
