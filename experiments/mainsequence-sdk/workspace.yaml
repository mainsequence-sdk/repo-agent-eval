schema_version: 11

workspace:
  id: mainsequence-sdk-evaluation
  # Optional. When omitted, runtime data lives in ~/ms_agent_eval/<workspace-id>.

executors:
  lan-inference:
    type: endpoint
    adapter: openai_compatible
    endpoints:
      - id: llama-cpp-17-18081
        base_url: http://192.168.1.17:18081/v1
        max_concurrent_requests: 2
      - id: llama-cpp-17-18080
        base_url: http://192.168.1.17:18080/v1
        max_concurrent_requests: 2
      - id: llama-server-10-11436
        base_url: http://192.168.1.10:11436/v1
        max_concurrent_requests: 4
  artifact-harness:
    type: harness
    adapter: artifact_exchange
  local-process:
    type: process
    adapter: local

models:
  author:
    name: gpt-5.6-sol
    deployment_revision: gpt-5.6-sol-2026-09-13
    parameters:
      temperature: 0.0
  solver:
    name: qwen3.6:27b-coding
    deployment_revision: qwen3.6-27b-coding-local-2026-09-13
    reasoning_effort: none
    parameters:
      temperature: 0.2
      max_tokens: 4096
      timeout: 600
  judge:
    name: qwen3.6:27b-coding
    deployment_revision: qwen3.6-27b-coding-local-2026-09-13
    reasoning_effort: none
    parameters:
      temperature: 0.0
      max_tokens: 2048
      timeout: 300

stages:
  author:
    executor: artifact-harness
    model: author
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 64000, wall_seconds: 1800}
  validate_judge:
    executor: lan-inference
    model: judge
    reuse: {policy: exact}
    budget: {model_calls: 100, tokens: 250000, wall_seconds: 1800}
  solve:
    executor: lan-inference
    model: solver
    reuse: {policy: exact}
    budget: {model_calls: 1, tokens: 32000, wall_seconds: 600}
  judge:
    executor: lan-inference
    model: judge
    reuse: {policy: exact}
    budget: {model_calls: 3, tokens: 64000, wall_seconds: 600}
  fit:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 1800}
  select:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 300}
  aggregate:
    executor: local-process
    reuse: {policy: exact}
    budget: {model_calls: 0, tokens: 0, wall_seconds: 300}

evaluation:
  repository:
    url: https://github.com/mainsequence-sdk/mainsequence-sdk
    ref: v8.1.12
  instructions:
    global:
      - agent_scaffold/AGENTS.md
    skills:
      directory: agent_scaffold/skills
    imports:
      - id: platform
        source: mcp
        note: >-
          Platform-owned skills imported from the authenticated Main Sequence MCP
          catalog and pinned by its manifest, ontology, resource paths, and content
          hashes. The imported files are experiment inputs; runs never refresh them.
        manifest: instructions/mainsequence-platform/manifest.yaml
        skills:
          directory: instructions/mainsequence-platform/skills
  case_authoring:
    instructions: case-authoring.md
    sources:
      - id: tutorial
        role: illustrative
        repository:
          url: https://github.com/mainsequence-projects/mainsequence-sdk-tutorial
          ref: v0.1.67
        include:
          - README.md
          - AGENTS.md
          - docs/**
          - src/**
          - tests/**
          - examples/**
      - id: mainsequence-markets
        role: project
        repository:
          url: https://github.com/mainsequence-projects/MainSequenceMarkets
          ref: v1.0.14
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - docs/**
          - src/**
          - apps/**
          - api/**
          - examples/**
          - tests/**
      - id: alpaca-connectors
        role: project
        repository:
          url: https://github.com/mainsequence-projects/alpaca-connectors
          ref: v0.1.32
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - tests/**
      - id: binance-connectors
        role: project
        repository:
          url: https://github.com/mainsequence-projects/binance-connectors
          ref: v0.1.25
        include:
          - AGENTS.md
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - agents/**
          - dashboards/**
          - examples/**
          - tests/**
      - id: marketsanalytics
        role: project
        repository:
          url: https://github.com/mainsequence-projects/marketsanalytics
          ref: v0.1.10
        include:
          - README.md
          - pyproject.toml
          - Dockerfile
          - .mainsequence/**
          - docs/**
          - src/**
          - api/**
          - agent_release/**
          - tests/**
      - id: command-center-sdk
        role: contract_reference
        repository:
          url: https://github.com/mainsequence-sdk/command-center-sdk
          ref: v0.1.21
        include:
          - command-center-sdk/AGENTS.md
          - command-center-sdk/README.md
          - command-center-sdk/contracts/**
          - command-center-sdk/docs/backend-contracts.md
          - command-center-sdk/docs/resources.md
          - command-center-sdk/src/contracts/**
          - command-center-sdk/src/resource/**
          - command-center-sdk/agent_scaffold/skills/contracts/**
          - command-center-sdk/agent_scaffold/skills/resource/**
  cases:
    directory: cases
    coverage:
      catalog: cases/coverage.yaml
      minimum_cases_per_skill: 20
      minimum_leakage_groups_per_skill: 10
  splits:
    file: cases/splits.yaml
    policy:
      seed: mainsequence-sdk-foundations-v1
      train: 0.7
      test: 0.2
      challenge: 0.1
  judge:
    dspy:
      module: Predict
      signature:
        inputs:
          task: str
          skill_context: str
          rubric: str
          expected_response: str
          expected_artifacts: str
          candidate_response: str
        outputs:
          criterion_scores: dict[str, float]
          hard_failures: list[str]
          feedback: str
    validation:
      directory: judge-validation
    repetitions: 3

experiments:
  baseline:
    mode: evaluate
    solver:
      dspy:
        module: Predict
        signature:
          inputs:
            global_context: str
            skill_context: str
            task: str
          outputs:
            response: str
    runtime:
      type: response_only
      python: "3.12"
    repetitions: 1
  optimize-few-shot:
    mode: optimize
    based_on: baseline
    optimizer:
      name: LabeledFewShot
      search:
        k: [1, 2, 4]
    cross_validation:
      folds: 5
      seed: 0
    budget:
      solver:
        model_calls: 100
        tokens: 250000
      judge:
        model_calls: 300
        tokens: 500000
      wall_seconds: 1800
