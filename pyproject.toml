[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ms-agent-eval"
version = "0.1.1"
description = "Library-agnostic repository-agent evaluation and prompt optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dspy==3.2.1",
  "matplotlib==3.11.2",
  "numpy==2.4.6",
  "plotly==7.0.0",
  "pyyaml>=6.0.2",
  "questionary>=2.1,<3",
  "rich>=13,<16",
  "scipy==1.18.1",
]

[project.optional-dependencies]
mlflow = [
  "mlflow==3.16.0",
]

[project.scripts]
ms-agent-eval = "ms_agent_eval.core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ms_agent_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "tests",
]
markers = [
  "docker: requires access to a running Docker daemon and pinned runtime image",
  "openai_compatible: requires a configured live OpenAI-compatible API",
  "mlflow: requires the pinned optional MLflow client and a local tracking store",
]
